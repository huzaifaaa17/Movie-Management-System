<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>NeonFlix Movie App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- Navbar -->
  <header class="navbar neon-shadow">
    <div class="brand" onclick="goto('home')"><span>🎬</span> NeonFlix</div>
    <nav>
      <a href="#home" onclick="goto('home')" id="nav-home">Home</a>
      <a href="#watchlist" onclick="goto('watchlist')" id="nav-watchlist">Watchlist</a>
      <a href="#profile" onclick="goto('profile')" id="nav-profile">Profile</a>
    </nav>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search movies..."/>
      <div id="search-suggestions" class="suggestions hidden"></div>
      <svg height="22" width="22" viewBox="0 0 24 24">
        <path fill="#fff" d="M9.5 3A6.5 6.5 0 1 1 3 9.5a6.51 6.51 0 0 1 6.5-6.5M2 21.5L8.5 15A8.5 8.5 0 1 0 15 8.5L21.5 2"/>
      </svg>
    </div>
  </header>
  <!-- App Content (by JS) -->
  <main id="app"></main>
  <!-- Footer -->
  <footer>
    <div>
      NeonFlix <span>&copy; 2025</span> For demo/dev only. Movie posters &copy; TMDb
    </div>
    <div class="socials">
      <a href="https://wa.me/923099934986" target="_blank" aria-label="WhatsApp">
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp">
      </a>
      <a href="https://www.instagram.com/huzaifaaa_17" target="_blank" aria-label="Instagram">
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram">
      </a>
    </div>
  </footer>



  <script src="app.js"></script>
</body>
</html>
